name: ResolveAI test suite
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/evaluate.py --output reports/evaluation.json
      - run: python scripts/evaluate.py --data data/tickets_challenge.jsonl --output reports/evaluation_challenge.json
